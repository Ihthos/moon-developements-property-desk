  <main class="main">
    <header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" id="menu-toggle" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="crumb"><span id="crumb-profile">Rental desk</span> <span aria-hidden="true">/</span> <b id="crumb-page">Dashboard</b></div></div><div class="top-actions"><label class="top-search"><span class="sr-only">Search clients</span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="global-search" placeholder="Search clients…" autocomplete="off"></label><div class="avatar">MH</div></div></header>
    <div class="content" id="app"></div>
  </main>
</div>
<div class="overlay" id="overlay" role="presentation"><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><div><h2 id="dialog-title">Dialog</h2><p id="dialog-subtitle"></p></div><button class="close" id="dialog-close" aria-label="Close dialog">&times;</button></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-foot" id="dialog-foot"></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var TODAY='2026-10-15';
  var moneyFmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
  function money(n){return moneyFmt.format(Number(n||0))}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmtDate(s){if(!s)return '—';var p=s.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})}
  function cents(n){return Math.round(n*100)}
  function statusPill(s){return '<span class="status '+(s==='Overdue'?'overdue':s==='Partial'?'partial':s==='Paid'||s==='Active'?'paid':s==='Draft'?'draft':s==='Issued'?'due':'vacant')+'">'+esc(s)+'</span>'}

  var PAGE_SIZE=25;
  var FIRST=['Ana','Michael','Sofia','David','Priya','James','Fatima','Robert','Elena','Daniel','Aisha','Thomas','Maya','Joseph','Leyla','Carlos','Nadia','Samuel','Grace','Hassan','Rita','Peter','Zara','Omar','Ingrid','Victor','Lina','Marcus','Rosa','Andre','Nadia','Chen','Amir','Julia','Ravi','Sara','Miguel','Yuki','Noor','Paolo'];
  var LAST=['Rahman','Bennett','Hayes','Brooks','Parker','Reed','Morgan','Ellis','Foster','Price','Cole','Miller','James','Bailey','Rivera','Turner','Ward','Cooper','Bell','Gray','Young','Lewis','Kelly','Cruz','Adams','Hill','Green','Diaz','Scott','Ross','Flores','Ahmed','Patel','Nguyen','Kim','Okafor','Silva','Haddad','Novak','Torres'];
  var BUILDINGS=['Moon 701 Ave C','Oakline House','Cedar Court','Riverside Flats','Harbor View','Sunnyside'];
  var JOBS=['Roof replacement','Kitchen remodel','Bathroom renovation','Interior painting','Electrical upgrade','Facade repair','Waterproofing','Flooring install','HVAC replacement','Window replacement'];
  function seeded(n){var x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}
  function pick(arr,n){return arr[Math.floor(seeded(n)*arr.length)%arr.length]}

  function makeClients(kind,count,startNum){
    var out=[],num=startNum;
    for(var i=0;i<count;i++){
      var name=(kind==='construction'? LAST[Math.floor(seeded(i*3+1)*LAST.length)]+' '+pick(['LLC','Inc.','Properties','Holdings','Group','Partners'],i*5):'')||'';
      if(kind==='construction'){name=LAST[Math.floor(seeded(i*3+1)*LAST.length)]+' '+['LLC','Inc.','Properties','Holdings','Group','Partners'][Math.floor(seeded(i*7)*6)];}
      else{name=FIRST[Math.floor(seeded(i*3+1)*FIRST.length)]+' '+LAST[Math.floor(seeded(i*3+2)*LAST.length)];}
      var invoiceCount=3+Math.floor(seeded(i*11)*28);
      var invoices=[];
      for(var k=0;k<invoiceCount;k++){
        var total=cents(80+seeded(i*100+k*13)*4200);
        var paidR=seeded(i*50+k*7);
        var paid=paidR>0.62?total:paidR>0.3?Math.round(total*paidR):0;
        var month=((k%12)+1);
        var inv={id:kind[0]+'-'+(num),number:(kind==='construction'?'C':'' )+(num),clientId:'',client:name,kind:kind,
          issueDate:'2026-'+String(10-Math.floor(k/4)).padStart(2,'0')+'-'+String(1+(k%27)).padStart(2,'0'),
          dueDate:'2026-'+String(10-Math.floor(k/4)).padStart(2,'0')+'-'+String(1+(k%27)+14).padStart(2,'0'),
          lines:kind==='construction'
            ? [{description:JOBS[Math.floor(seeded(i*17+k)*JOBS.length)],qty:1,rate:Math.round(total/100/50)*50},{description:'Materials & permits',qty:1,rate:Math.round(total/100/40)*40}]
            : [{description:'Rent · '+['January','February','March','April','May','June','July','August','September','October'][k%10]+' 2026',qty:1,rate:Math.round(total/100/10)*10}],
          status:paid>=total?'Paid':paid>0?'Partial':'Overdue',paid:paid,balance:total-paid};
        if(k<3){inv.status='Draft';inv.balance=total;inv.paid=0;}
        invoices.push(inv);num++;
      }
      var billed=invoices.reduce(function(a,x){return a+x.lines.reduce(function(b,l){return b+cents(l.qty*l.rate)},0)},0);
      var paid=invoices.reduce(function(a,x){return a+x.paid},0);
      out.push({id:kind[0]+'-c'+i,name:name,kind:kind,
        email:name.toLowerCase().replace(/[^a-z]/g,'.')+'@example.invalid',
        phone:'('+ (200+Math.floor(seeded(i*23)*700)) +') '+ (100+Math.floor(seeded(i*29)*800)) +'-'+(1000+Math.floor(seeded(i*31)*8999)),
        address:(100+Math.floor(seeded(i*41)*900))+' '+pick(['Ocean Pkwy','Ave C','Broadway','Eastern Pkwy','Flatbush Ave','Ocean Ave','Bedford Ave','Coney Island Ave'],i*13)+', Brooklyn, NY',
        building:kind==='rental'?BUILDINGS[Math.floor(seeded(i*19)*BUILDINGS.length)]:(1+Math.floor(seeded(i*23)*40))+' '+(pick(BUILDINGS,i*29)),
        unit:kind==='rental'?String.fromCharCode(65+(i%6))+String(1+(i%25)).padStart(2,'0'):'',
        job:kind==='construction'?JOBS[Math.floor(seeded(i*31)*JOBS.length)]:'',
        invoices:invoices,billed:billed,paid:paid,open:billed-paid});
    }
    return out;
  }
  var RENTAL=makeClients('rental',161,4001);
  var CONSTRUCTION=makeClients('construction',55,9001);
  RENTAL.forEach(function(c){c.invoices.forEach(function(i){i.clientId=c.id})});
  CONSTRUCTION.forEach(function(c){c.invoices.forEach(function(i){i.clientId=c.id})});
  var DATA={rental:RENTAL,construction:CONSTRUCTION};

  var NAV={
    rental:[['dashboard','Dashboard','M4 19V9l8-5 8 5v10'],['clients','Clients','M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4 21c0-4 4-6 8-6s8 2 8 6'],['invoices','Invoices','M6 2h9l4 4v16H6z']],
    construction:[['dashboard','Dashboard','M4 19V9l8-5 8 5v10'],['clients','Clients','M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4 21c0-4 4-6 8-6s8 2 8 6'],['invoices','Invoices','M6 2h9l4 4v16H6z']]
  };
  var state={profile:'rental',page:'dashboard',clientId:null,query:'',pageIndex:0,invQuery:'',invPage:0};
  var $=function(s){return document.querySelector(s)};
  var app=$('#app'),overlay=$('#overlay'),dialog=$('#dialog');
  function clients(){return DATA[state.profile]}
  function label(){return state.profile==='rental'?'Rental desk':'Construction desk'}
  function icons(vb,k){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="'+(NAV[state.profile].find(function(x){return x[0]===k})||[0,0,'M4 12h16'])[2]+'"/></svg>'}

  function persist(){}
  function toast(msg){var t=$('#toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2600)}

  function renderNav(){
    var n=NAV[state.profile];
    $('#nav').innerHTML=n.map(function(x){return '<button class="nav-btn '+(state.page===x[0]?'active':'')+'" data-action="nav" data-page="'+x[0]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="'+x[2]+'"/></svg>'+x[1]+'</button>'}).join('');
    $('#nav-label').textContent=state.profile==='rental'?'Rental':'Construction';
    $('#side-profile').textContent=label();
    $('#crumb-profile').textContent=label();
    $('#side-avatar').textContent=state.profile==='rental'?'MH':'MH';
  }
  function pageHead(title,sub,actions){
    return '<div class="page-head"><div><div class="eyebrow">'+label()+' · '+fmtDate(TODAY)+'</div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="head-actions">'+(actions||'')+'</div></div>';
  }
  function stat(l,v,f,c){return '<article class="stat"><div class="stat-top"><span class="stat-label">'+l+'</span></div><div class="stat-value">'+v+'</div><div class="stat-foot">'+f+'</div></article>'}

  function dashboard(){
    var cs=clients(),billed=cs.reduce(function(a,c){return a+c.billed},0),paid=cs.reduce(function(a,c){return a+c.paid},0),open=billed-paid;
    var invCount=cs.reduce(function(a,c){return a+c.invoices.length},0);
    return pageHead('Good morning, Morshed','Here is what needs your attention across the '+label().toLowerCase()+'.','<button class="btn primary" data-action="nav" data-page="clients">Open clients</button>')
      +'<section class="stats">'+stat('Clients',cs.length,'Active '+(state.profile==='rental'?'tenants':'construction clients'),'')
      +stat('Invoices',invCount,state.profile==='rental'?'Issued and drafts':'Issued and drafts','')
      +stat('Billed',money(billed/100),'All time','')
      +stat('Open balance',money(open/100),'Across '+cs.filter(function(c){return c.open>0}).length+' clients','')
      +'</section>'
      +'<section class="panel"><div class="panel-head"><div><div class="panel-title">Clients with an open balance</div><div class="panel-sub">Click a name to open the full client profile</div></div><button class="btn ghost small" data-action="nav" data-page="clients">View all</button></div>'
      +'<div class="table-wrap"><table class="table"><thead><tr><th>Client</th><th>Invoices</th><th>Billed</th><th>Paid</th><th>Open</th></tr></thead><tbody>'
      +cs.slice().sort(function(a,b){return b.open-a.open}).slice(0,8).map(function(c){return '<tr><td><button class="mini-action" data-action="client" data-id="'+c.id+'">'+esc(c.name)+'</button><div class="secondary-text">'+esc(state.profile==='rental'?c.building+' · '+c.unit:c.job)+'</div></td><td>'+c.invoices.length+'</td><td class="money">'+money(c.billed/100)+'</td><td class="money">'+money(c.paid/100)+'</td><td class="money negative">'+money(c.open/100)+'</td></tr>'}).join('')
      +'</tbody></table></div></section>';
  }
  function filteredClients(){var q=state.query.toLowerCase();return clients().filter(function(c){return !q||(c.name+' '+c.building+' '+c.unit+' '+c.job+' '+c.email).toLowerCase().indexOf(q)>=0})}
  function clientsPage(){
    var list=filteredClients(),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
    state.pageIndex=Math.min(state.pageIndex,pages-1);
    var rows=list.slice(state.pageIndex*PAGE_SIZE,(state.pageIndex+1)*PAGE_SIZE);
    return pageHead('Clients','Search '+clients().length+' '+label().toLowerCase()+' clients. Click a name to open the profile.','<button class="btn" data-action="export">Export CSV</button>')
      +'<div class="toolbar"><label class="searchbox input"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#82908a" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input class="input" id="client-search" type="search" value="'+esc(state.query)+'" placeholder="Client name, building, unit, or email"></label><span class="results-note">'+list.length+' of '+clients().length+' clients</span></div>'
      +'<section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Client</th><th>'+(state.profile==='rental'?'Property':'Job')+'</th><th>Invoices</th><th>Billed</th><th>Paid</th><th>Open</th><th></th></tr></thead><tbody>'
      +(rows.length?rows.map(function(c){return '<tr><td><div class="primary-text"><button class="mini-action" data-action="client" data-id="'+c.id+'">'+esc(c.name)+'</button></div><div class="secondary-text">'+esc(c.email)+'</div></td><td>'+esc(state.profile==='rental'?c.building+' · Unit '+c.unit:c.job)+'<div class="secondary-text">'+esc(state.profile==='rental'?c.address:c.building)+'</div></td><td>'+c.invoices.length+'</td><td class="money">'+money(c.billed/100)+'</td><td class="money">'+money(c.paid/100)+'</td><td class="money '+(c.open?'negative':'')+'">'+money(c.open/100)+'</td><td><button class="mini-action" data-action="client" data-id="'+c.id+'">Open ↗</button></td></tr>'}).join(''):'<tr><td colspan="7"><div class="empty">No clients match &ldquo;'+esc(state.query)+'&rdquo;.</div></td></tr>')
      +'</tbody></table></div>'
      +'<div class="pager"><span>Showing '+(list.length?state.pageIndex*PAGE_SIZE+1:0)+'–'+Math.min(list.length,(state.pageIndex+1)*PAGE_SIZE)+' of '+list.length+' clients</span><div>Page '+(state.pageIndex+1)+' of '+pages+' &nbsp; <button data-action="prev" '+(state.pageIndex===0?'disabled':'')+'>Previous</button> <button data-action="next" '+(state.pageIndex>=pages-1?'disabled':'')+'>Next</button></div></div></section>';
  }
  function clientProfile(){
    var c=clients().find(function(x){return x.id===state.clientId});
    if(!c)return '<div class="empty">Client not found.</div>';
    return pageHead(esc(c.name),esc(c.address),'<button class="btn ghost small" data-action="nav" data-page="clients">← All clients</button><button class="btn primary" data-action="new-invoice" data-id="'+c.id+'">New invoice</button>')
      +'<section class="stats">'+stat('Billed',money(c.billed/100),'All invoices','')+stat('Paid',money(c.paid/100),'Received','')+stat('Open balance',money(c.open/100),c.open>0?'Needs follow-up':'Up to date','')+stat('Invoices',String(c.invoices.length),'Issued + drafts','')+'</section>'
      +'<div class="grid-main"><section class="panel"><div class="panel-head"><div><div class="panel-title">Client details</div><div class="panel-sub">Contact and property on file</div></div></div><div style="padding:0 18px 18px"><table class="table"><tbody>'
      +'<tr><td class="secondary-text">Name</td><td class="primary-text">'+esc(c.name)+'</td></tr>'
      +'<tr><td class="secondary-text">'+(state.profile==='rental'?'Building':'Project site')+'</td><td>'+esc(c.building)+'</td></tr>'
      +(state.profile==='rental'?'<tr><td class="secondary-text">Unit</td><td>'+esc(c.unit)+'</td></tr>':'<tr><td class="secondary-text">Job</td><td>'+esc(c.job)+'</td></tr>')
      +'<tr><td class="secondary-text">Address</td><td>'+esc(c.address)+'</td></tr>'
      +'<tr><td class="secondary-text">Email</td><td>'+esc(c.email)+'</td></tr>'
      +'<tr><td class="secondary-text">Phone</td><td>'+esc(c.phone)+'</td></tr>'
      +'</tbody></table></div></section>'
      +'<section class="panel"><div class="panel-head"><div><div class="panel-title">Invoice history</div><div class="panel-sub">'+c.invoices.length+' invoices · click one to edit</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Total</th><th>Balance</th><th>Status</th></tr></thead><tbody>'
      +c.invoices.slice(0,12).map(function(i){return '<tr><td><button class="mini-action" data-action="invoice" data-id="'+i.id+'">#'+esc(i.number)+'</button></td><td>'+fmtDate(i.issueDate)+'</td><td class="money">'+money(i.lines.reduce(function(a,l){return a+cents(l.qty*l.rate)},0)/100)+'</td><td class="money '+(i.balance?'negative':'')+'">'+money(i.balance/100)+'</td><td>'+statusPill(i.status)+'</td></tr>'}).join('')
      +'</tbody></table></div></section></div>';
  }
  function invoicesPage(){
    var all=[];clients().forEach(function(c){c.invoices.forEach(function(i){all.push(i)})});
    var q=state.invQuery.toLowerCase();
    var list=all.filter(function(i){return !q||(i.number+' '+i.client).toLowerCase().indexOf(q)>=0});
    list.sort(function(a,b){return b.issueDate.localeCompare(a.issueDate)});
    var pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));state.invPage=Math.min(state.invPage,pages-1);
    var rows=list.slice(state.invPage*PAGE_SIZE,(state.invPage+1)*PAGE_SIZE);
    return pageHead('Invoices','Saved '+label().toLowerCase()+' invoices. Click an invoice to open the editor and type on it.','<button class="btn primary" data-action="new-invoice">Create invoice</button>')
      +'<div class="toolbar"><label class="searchbox input"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#82908a" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input class="input" id="inv-search" type="search" value="'+esc(state.invQuery)+'" placeholder="Invoice number or client"></label><span class="results-note">'+list.length+' of '+all.length+' invoices</span></div>'
      +'<section class="panel"><div class="table-wrap"><table class="table" style="white-space:normal"><thead><tr><th>Invoice</th><th>Client</th><th>Issued</th><th>Total</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>'
      +(rows.length?rows.map(function(i){return '<tr><td><div class="primary-text">#'+esc(i.number)+'</div><div class="secondary-text">'+esc(i.lines[0].description)+'</div></td><td>'+esc(i.client)+'</td><td>'+fmtDate(i.issueDate)+'</td><td class="money">'+money(i.lines.reduce(function(a,l){return a+cents(l.qty*l.rate)},0)/100)+'</td><td class="money '+(i.balance?'negative':'')+'">'+money(i.balance/100)+'</td><td>'+statusPill(i.status)+'</td><td><button class="mini-action" data-action="invoice" data-id="'+i.id+'">Open editor ↗</button></td></tr>'}).join(''):'<tr><td colspan="7"><div class="empty">No invoices match.</div></td></tr>')
      +'</tbody></table></div><div class="pager"><span>Showing '+(list.length?state.invPage*PAGE_SIZE+1:0)+'–'+Math.min(list.length,(state.invPage+1)*PAGE_SIZE)+' of '+list.length+' invoices</span><div>Page '+(state.invPage+1)+' of '+pages+' &nbsp; <button data-action="inv-prev" '+(state.invPage===0?'disabled':'')+'>Previous</button> <button data-action="inv-next" '+(state.invPage>=pages-1?'disabled':'')+'>Next</button></div></div></section>';
  }

  function findInvoice(id){var f=null;clients().forEach(function(c){c.invoices.forEach(function(i){if(i.id===id)f=i})});return f}
  function editorTotals(){return {sub:0,tax:0,total:0}}
  function openEditor(inv){
    var body='<div class="dialog-head" style="display:none"></div>';
    var rowsHtml=inv.lines.map(function(l,idx){return '<tr data-line="'+idx+'"><td><input class="input" data-field="description" data-idx="'+idx+'" value="'+esc(l.description)+'"></td><td style="width:70px"><input class="input" data-field="qty" data-idx="'+idx+'" type="number" min="0" step="1" value="'+l.qty+'"></td><td style="width:110px"><input class="input" data-field="rate" data-idx="'+idx+'" type="number" min="0" step="0.01" value="'+l.rate+'"></td><td class="money" data-line-total="'+idx+'">'+money(cents(l.qty*l.rate)/100)+'</td><td><button class="mini-action" data-action="remove-line" data-idx="'+idx+'">×</button></td></tr>'}).join('');
    $('#dialog').classList.add('wide');
    $('#dialog-title').textContent='Invoice #'+inv.number;
    $('#dialog-subtitle').textContent=inv.client+' · '+fmtDate(inv.issueDate)+' · Demo — nothing is issued or sent';
    $('#dialog-body').innerHTML='<div class="invoice-paper"><div class="invoice-top"><div><div class="invoice-brand">Moon Developements<small>'+(state.profile==='rental'?'Rental desk':'Construction desk')+'</small></div></div><div class="invoice-title"><h3>INVOICE</h3><div>#'+esc(inv.number)+'</div></div></div>'
      +'<div class="toolbar" style="margin:14px 0 0">Type on any field — totals update as you go.</div>'
      +'<table class="invoice-lines" id="editor-lines"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>'+rowsHtml+'</tbody></table>'
      +'<button class="btn small" data-action="add-line">+ Add line</button>'
      +'<div class="invoice-total" style="margin-top:16px"><div class="terms">This is a demo invoice. Editing here never issues, sends, or records a payment.</div><div class="totals"><div class="total-line"><span>Subtotal</span><strong id="ed-sub">—</strong></div><div class="total-line"><span>'+(state.profile==='rental'?'Tax':'Tax')+'</span><strong id="ed-tax">—</strong></div><div class="total-line due"><span>Total due</span><strong id="ed-total">—</strong></div></div></div></div>';
    $('#dialog-foot').innerHTML='<span class="secondary-text">Demo only · edits are not saved</span><div><button class="btn" data-action="close">Close</button><button class="btn primary" data-action="save-invoice" data-id="'+inv.id+'">Save draft</button></div>';
    overlay.classList.add('show');
    document.querySelectorAll('#editor-lines input').forEach(function(el){el.addEventListener('input',function(){recalc()})});
    recalc();
  }
  function recalc(){
    var sub=0;
    document.querySelectorAll('#editor-lines tbody tr').forEach(function(tr){
      var idx=tr.getAttribute('data-line');
      var qty=parseFloat(tr.querySelector('[data-field="qty"]').value)||0;
      var rate=parseFloat(tr.querySelector('[data-field="rate"]').value)||0;
      var amt=cents(qty*rate);sub+=amt;
      var cell=tr.querySelector('[data-line-total="'+idx+'"]');if(cell)cell.textContent=money(amt/100);
    });
    var tax=0; // Rental tax stays zero; construction demo also zero here
    $('#ed-sub').textContent=money(sub/100);
    $('#ed-tax').textContent=money(tax/100);
    $('#ed-total').textContent=money((sub+tax)/100);
  }
  function collectLines(){
    var lines=[];
    document.querySelectorAll('#editor-lines tbody tr').forEach(function(tr){
      lines.push({description:tr.querySelector('[data-field="description"]').value,qty:parseFloat(tr.querySelector('[data-field="qty"]').value)||0,rate:parseFloat(tr.querySelector('[data-field="rate"]').value)||0});
    });
    return lines;
  }

  function focusEl(id){var el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}}
  function onClientSearch(e){state.query=e.target.value;state.pageIndex=0;render();focusEl('client-search')}
  function onInvSearch(e){state.invQuery=e.target.value;state.invPage=0;render();focusEl('inv-search')}
  function render(){
    renderNav();
    var html=state.page==='dashboard'?dashboard():state.page==='clients'?clientsPage():state.page==='client'?clientProfile():invoicesPage();
    app.innerHTML=html;
    var cs=$('#client-search');if(cs)cs.addEventListener('input',onClientSearch);
    var is=$('#inv-search');if(is)is.addEventListener('input',onInvSearch);
    $('#crumb-page').textContent=state.page.charAt(0).toUpperCase()+state.page.slice(1);
  }

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-action]');if(!el)return;
    var a=el.getAttribute('data-action');
    if(a==='nav'){state.page=el.getAttribute('data-page');state.query='';state.pageIndex=0;state.invQuery='';state.invPage=0;render();}
    else if(a==='client'){state.clientId=el.getAttribute('data-id');state.page='client';render();}
    else if(a==='invoice'){var inv=findInvoice(el.getAttribute('data-id'));if(inv)openEditor(inv);}
    else if(a==='switch-profile'){state.profile=state.profile==='rental'?'construction':'rental';state.page='dashboard';state.query='';state.pageIndex=0;render();toast('Switched to the <em>'+label()+'</em>. Rental and Construction stay separate.');}
    else if(a==='prev'){state.pageIndex=Math.max(0,state.pageIndex-1);render();}
    else if(a==='next'){state.pageIndex++;render();}
    else if(a==='inv-prev'){state.invPage=Math.max(0,state.invPage-1);render();}
    else if(a==='inv-next'){state.invPage++;render();}
    else if(a==='export'){var rows=['client,email,building,unit,invoices,billed,paid,open'].concat(clients().map(function(c){return [c.name,c.email,c.building,c.unit||c.job,c.invoices.length,(c.billed/100).toFixed(2),(c.paid/100).toFixed(2),(c.open/100).toFixed(2)].join(',')}));var blob=new Blob([rows.join('\n')],{type:'text/csv'});var u=URL.createObjectURL(blob);var link=document.createElement('a');link.href=u;link.download=state.profile+'-clients.csv';link.click();URL.revokeObjectURL(u);toast('Downloaded <em>'+state.profile+'-clients.csv</em>');}
    else if(a==='new-invoice'){var cid=el.getAttribute('data-id');var c=cid?clients().find(function(x){return x.id===cid}):clients()[0];var inv={id:'new-'+Date.now(),number:'DRAFT',client:c?c.name:'',kind:state.profile,issueDate:TODAY,dueDate:TODAY,lines:[{description:state.profile==='construction'?'Work description':'Rent','qty':1,'rate':0}],status:'Draft',paid:0,balance:0};openEditor(inv);}
    else if(a==='add-line'){var tb=document.querySelector('#editor-lines tbody');var idx=tb.children.length;var tr=document.createElement('tr');tr.setAttribute('data-line',idx);tr.innerHTML='<td><input class="input" data-field="description" data-idx="'+idx+'" value=""></td><td style="width:70px"><input class="input" data-field="qty" data-idx="'+idx+'" type="number" value="1"></td><td style="width:110px"><input class="input" data-field="rate" data-idx="'+idx+'" type="number" value="0"></td><td class="money" data-line-total="'+idx+'">$0.00</td><td><button class="mini-action" data-action="remove-line" data-idx="'+idx+'">×</button></td>';tb.appendChild(tr);tr.querySelectorAll('input').forEach(function(i){i.addEventListener('input',recalc)});recalc();}
    else if(a==='remove-line'){var tr=el.closest('tr');if(tr&&document.querySelectorAll('#editor-lines tbody tr').length>1)tr.remove();recalc();}
    else if(a==='save-invoice'){toast('Demo only — <em>nothing was issued, sent, or recorded</em>.');closeDialog();}
    else if(a==='close'){closeDialog();}
  });
  function closeDialog(){overlay.classList.remove('show');$('#dialog').classList.remove('wide')}
  $('#dialog-close').addEventListener('click',closeDialog);
  overlay.addEventListener('click',function(e){if(e.target===overlay)closeDialog()});
  $('#menu-toggle').addEventListener('click',function(){$('#sidebar').classList.toggle('open')});
  $('#global-search').addEventListener('input',function(e){state.query=e.target.value;state.pageIndex=0;state.page='clients';render();focusEl('client-search')});

  render();
  window.__demoReady=true;
})();
</script>
</body>
</html>
